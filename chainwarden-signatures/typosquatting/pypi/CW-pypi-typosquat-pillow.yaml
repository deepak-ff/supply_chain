id: CW-pypi-typosquat-pillow
name: Typosquatting target — pillow (50M+ monthly downloads)

type: typosquatting_target
ecosystem: pypi
severity: HIGH

target: pillow

similar_names:
  - piilow
  - pilow
  - pilllow
  - pilloww
  - pilliow
  - pillw
