id: CW-pypi-typosquat-numpy
name: Typosquatting target — numpy (50M+ monthly downloads)

type: typosquatting_target
ecosystem: pypi
severity: HIGH

target: numpy

similar_names:
  - numyp
  - numppy
  - numpyy
  - numby
  - nummpy
