id: CW-rubygems-git-credential-manager-sleepergem
name: git_credential_manager gem hijacked via dormant account
type: blocklisted_package
ecosystem: rubygems
severity: CRITICAL
package: git_credential_manager
version_range: ">=2.8.0,<=2.8.3"
description: |
  The git_credential_manager gem was hijacked through a dormant RubyGems maintainer account
  in the SleeperGem campaign. Versions 2.8.0-2.8.3 download binaries from git.disroot.org
  with SSL verification disabled, then execute via PowerShell (Windows) or /bin/sh (Unix).
  The malware specifically avoids CI environments by checking ~30 CI-related env variables.
cve: ~
references:
  - https://www.aikido.dev/blog/sleepergem-rubygems-supply-chain-attack
author: chainwarden
tags: [account-hijack, dormant-maintainer, dropper, rubygems, supply-chain]
