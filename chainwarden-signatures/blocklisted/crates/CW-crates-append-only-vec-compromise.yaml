id: CW-crates-append-only-vec-compromise
name: Compromised append-only-vec crate with credential stealer
type: blocklisted_package
ecosystem: crates
severity: CRITICAL
package: append-only-vec
version_range: "=0.1.9"
description: |
  The append-only-vec crate (4M downloads) was compromised in version 0.1.9 via injected
  proc-macro1 typosquat dependency. The build.rs payload downloads platform-specific binaries
  (Linux x86_64, macOS aarch64) that steal browser credentials from Chromium-based browsers
  and establish persistent C2 communication with 23.254.165.112:443.
cve: ~
references:
  - https://www.aikido.dev/blog/two-popular-rust-crates-arrayref-and-append-only-vec-compromised-in-supply-chain-attack
author: chainwarden
tags: [compromised-maintainer, credential-theft, rust, supply-chain]
