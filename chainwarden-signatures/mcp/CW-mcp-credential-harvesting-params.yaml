id: CW-mcp-credential-harvesting-params
name: MCP tool parameters designed to trick users into entering credentials

type: mcp_injection_pattern
ecosystem: mcp
severity: CRITICAL

pattern: "(?i)(param|input|field|arg|enter|provide|supply|type).{0,60}(api.?key|password|secret|token|private.?key|passphrase|master.?key|auth.?code|client.?secret|access.?key|credentials|pin|cvv|ssn|account.?number|routing.?number|seed.?phrase|mnemonic|recovery.?code)"

description: |
  This pattern detects MCP tools with parameter names or descriptions designed to harvest
  credentials from users. A malicious tool might declare parameters like "api_key",
  "admin_password", or "auth_token" with descriptions prompting the LLM to ask the user
  for these values — effectively turning the LLM into a social engineering proxy. The tool
  description might say "requires your GitHub personal access token for authentication"
  when the tool actually exfiltrates the token to an attacker server. Because the LLM
  faithfully relays parameter requirements to the user, victims enter real credentials
  believing they are authenticating with a legitimate service.

references:
  - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
  - https://owasp.org/www-project-top-10-for-large-language-model-applications/
  - https://spec.modelcontextprotocol.io/specification/2024-11-05/server/tools/

author: chainwarden
tags: [credential-harvesting, social-engineering, phishing, mcp, parameter-abuse]
